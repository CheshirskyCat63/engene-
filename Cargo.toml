[workspace]
members = [
    ".",
    "crates/engine_core",
    "crates/engine_ecs",
    "crates/engine_world",
    "crates/engine_runtime",
    "crates/engine_render",
    "crates/engine_physics",
    "crates/engine_audio",
    "crates/engine_content",
    "crates/engine_tools",
    "crates/sdk_app",
    "crates/game_framework",
    "crates/engine_startup",
    "apps/engene_game",
    "apps/engene_sdk",
    "apps/engene_headless",
    "apps/engene_bootstrap",
]
resolver = "2"

[workspace.dependencies]
engine_startup = { path = "crates/engine_startup", version = "0.1.0" }

[package]
name = "engene"
version = "0.1.0"
edition = "2021"
autobins = false

[features]
default = ["thin-shell"]

# Minimal root features - apps own capabilities
thin-shell = []

# Transitional compatibility aliases (being removed)
role_game = []
role_sdk = []
role_headless = []
role_tools = []

# Legacy capability flags (moved to apps)
cap_physics = []
cap_render = []
cap_ai = []
cap_audio = []
cap_networking = []

tool_debug_ui = []
tool_sdk = []
tool_doctor = []
tool_editor_inspection = []

# Legacy profiles (moved to apps)
profile_low_spec = []
profile_ci = []
profile_release = []

# Legacy feature backlog (being deleted)
engine_core = []
physics = []
render = []
ai = []
audio = []
headless = []
debug_ui = []
full = []
nightly-tests = []
body_sim = []
advanced_anim = []
networking = []
scoring_ai = []
low_spec = []
sdk_tools = []

[[bench]]
name = "engine_benchmarks"
harness = false
[[bench]]
name = "hot_paths"
harness = false
[profile.release]
opt-level = 3
lto = "thin"
strip = "none"

[profile.shipping]
inherits = "release"
opt-level = 3
lto = "fat"
strip = "symbols"
codegen-units = 1

[profile.low-spec]
inherits = "release"
opt-level = 3
lto = "thin"

[profile.debug-tools]
inherits = "dev"
opt-level = 1

[profile.sdk-tools]
inherits = "release"
opt-level = 2
lto = "thin"

[profile.headless-server]
inherits = "release"
opt-level = 3
lto = "thin"

[profile.bench]
inherits = "release"
opt-level = 3
lto = "off"
codegen-units = 16

[dependencies]
# Core engine crates - minimal dependencies
engine_core = { path = "crates/engine_core" }
engine_ecs = { path = "crates/engine_ecs" }
engine_runtime = { path = "crates/engine_runtime" }
engine_startup = { path = "crates/engine_startup" }

# External dependencies - reduced set
rand = "0.8"
glam = "0.30"
bytemuck = { version = "1", features = ["derive"] }
slotmap = "1"
tracing = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bincode = "1"
ron = "0.8"
bitflags = "2"
parking_lot = "0.12"

# Optional heavy dependencies - move to apps
# puffin = "0.19"  # → engine_tools/profiling
# winit = "0.30"    # → apps/windowing
# wgpu = "0.17"     # → engine_render
# image = "0.25"     # → engine_content
# egui = "0.23"      # → engine_tools/ui
# egui-winit = "0.23" # → apps/windowing
# egui-wgpu = "0.23"  # → engine_render/ui
# tracing-subscriber = "0.3" # → apps/logging
# rayon = "1.0"      # → engine_runtime/parallel
# pollster = "0.3"    # → engine_async
# pathfinding = "4.0" # → engine_navigation

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
glob = "0.3"
tempfile = "3"

[[bench]]
name = "simulation_transition_core"
harness = false


[[bench]]
name = "kernel_throughput"
harness = false

[[bench]]
name = "boundary_cost"
harness = false

[[bench]]
name = "tick_pressure"
harness = false
