[workspace]
members = [
    ".",
    "crates/engine_core",
    "crates/engine_ecs",
    "crates/engine_world",
    "crates/engine_runtime",
    "crates/engine_render",
    "crates/engine_physics",
    "crates/engine_audio",
    "crates/engine_content",
    "crates/engine_tools",
    "crates/sdk_app",
    "crates/game_framework",
    "crates/engine_startup",
    "apps/engene_game",
    "apps/engene_sdk",
    "apps/engene_headless",
    "apps/engene_bootstrap",
]
resolver = "2"

[workspace.dependencies]
engine_startup = { path = "crates/engine_startup", version = "0.1.0" }

[package]
name = "engene"
version = "0.1.0"
edition = "2021"
autobins = false

[features]
default = ["full"]

# Target taxonomy (semantic truth)
role_game = ["cap_physics", "cap_render", "cap_ai", "cap_audio", "tool_debug_ui", "body_sim", "advanced_anim", "scoring_ai"]
role_sdk = ["role_game", "tool_sdk", "tool_doctor", "tool_editor_inspection"]
role_headless = ["cap_physics", "cap_ai", "body_sim", "advanced_anim", "scoring_ai"]
role_tools = ["tool_doctor"]

cap_physics = ["physics"]
cap_render = ["render"]
cap_ai = ["ai"]
cap_audio = ["audio"]
cap_networking = ["networking"]

tool_debug_ui = ["debug_ui"]
tool_sdk = ["sdk_tools"]
tool_doctor = []
tool_editor_inspection = []

profile_low_spec = ["low_spec"]
profile_ci = ["nightly-tests"]
profile_release = ["full"]

# Backward-compatibility aliases (transitional)
engine_core = []
physics = ["engine_core", "engine_physics"]
render = ["engine_core"]
ai = ["engine_core"]
audio = ["engine_core"]
headless = ["role_headless"]
debug_ui = ["render"]
full = ["physics", "render", "ai", "audio", "debug_ui", "body_sim", "advanced_anim", "scoring_ai"]
nightly-tests = []
body_sim = []
advanced_anim = []
networking = []
scoring_ai = []
low_spec = ["full"]
sdk_tools = ["full", "debug_ui"]

[[bench]]
name = "engine_benchmarks"
harness = false
[[bench]]
name = "hot_paths"
harness = false
[profile.release]
opt-level = 3
lto = "thin"
strip = "none"

[profile.shipping]
inherits = "release"
opt-level = 3
lto = "fat"
strip = "symbols"
codegen-units = 1

[profile.low-spec]
inherits = "release"
opt-level = 3
lto = "thin"

[profile.debug-tools]
inherits = "dev"
opt-level = 1

[profile.sdk-tools]
inherits = "release"
opt-level = 2
lto = "thin"

[profile.headless-server]
inherits = "release"
opt-level = 3
lto = "thin"

[profile.bench]
inherits = "release"
opt-level = 3
lto = "off"
codegen-units = 16

[dependencies]
engine_core = { path = "crates/engine_core" }
engine_content = { path = "crates/engine_content" }
engine_ecs = { path = "crates/engine_ecs" }
engine_runtime = { path = "crates/engine_runtime" }
engine_physics = { path = "crates/engine_physics", optional = true }
engine_startup = { path = "crates/engine_startup" }
rand = "0.8"
glam = "0.30"
bytemuck = { version = "1", features = ["derive"] }
slotmap = "1"
tracing = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bincode = "1"
ron = "0.8"
puffin = "0.19"
bitflags = "2"
winit = "0.30"
wgpu = "0.17"
image = "0.25"
egui = "0.23"
egui-winit = "0.23"
egui-wgpu = "0.23"
tracing-subscriber = "0.3"
rayon = "1.0"
pollster = "0.3"
pathfinding = "4.0"
parking_lot = "0.12"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
glob = "0.3"
tempfile = "3"

[[bench]]
name = "simulation_transition_core"
harness = false


[[bench]]
name = "kernel_throughput"
harness = false

[[bench]]
name = "boundary_cost"
harness = false

[[bench]]
name = "tick_pressure"
harness = false
