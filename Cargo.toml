[workspace]
members = [
    "crates/engine_core",
    "crates/engine_ecs",
    "crates/engine_world",
    "crates/engine_runtime",
    "crates/engine_render",
    "crates/engine_physics",
    "crates/engine_audio",
    "crates/engine_content",
    "crates/engine_tools",
    "crates/sdk_app",
    "crates/game_framework",
    "crates/engine_startup",
    "apps/engene_game",
    "apps/engene_sdk",
    "apps/engene_headless",
    "apps/engene_bootstrap",
]
resolver = "2"

[workspace.dependencies]
engine_startup = { path = "crates/engine_startup", version = "0.1.0" }
# egui = "0.23"      # → engine_tools/ui
# egui-winit = "0.23" # → apps/windowing
# egui-wgpu = "0.23"  # → engine_render/ui
# tracing-subscriber = "0.3" # → apps/logging
# rayon = "1.0"      # → engine_runtime/parallel
# pollster = "0.3"    # → engine_async
# pathfinding = "4.0" # → engine_navigation

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
glob = "0.3"
tempfile = "3"

[[bench]]
name = "simulation_transition_core"
harness = false


[[bench]]
name = "kernel_throughput"
harness = false

[[bench]]
name = "boundary_cost"
harness = false

[[bench]]
name = "tick_pressure"
harness = false
