[package]
name = "engene"
version = "0.1.0"
edition = "2021"

[features]
default = ["full"]
engine_core = []
physics = ["engine_core"]
render = ["engine_core"]
ai = ["engine_core"]
audio = ["engine_core"]
headless = ["engine_core", "physics", "ai"]
debug_ui = ["render"]
full = ["physics", "render", "ai", "audio", "debug_ui", "body_sim", "advanced_anim", "scoring_ai"]
nightly-tests = []
audio_playback = ["rodio"]
body_sim = []
advanced_anim = []
networking = []
scoring_ai = []
low_spec = ["full"]
sdk_tools = ["full", "debug_ui"]

[[bin]]
name = "engene_game"
path = "src/bin/engene_game.rs"

[[bin]]
name = "engene_sdk"
path = "src/bin/engene_sdk.rs"

[[bin]]
name = "engene_headless"
path = "src/bin/engene_headless.rs"

[[bin]]
name = "engene_test"
path = "src/bin/engene_test.rs"

[[bench]]
name = "engine_benchmarks"
harness = false

[[bench]]
name = "hot_paths"
harness = false

[profile.release]
opt-level = 3
lto = "thin"
strip = "none"

[profile.shipping]
inherits = "release"
opt-level = 3
lto = "fat"
strip = "symbols"
codegen-units = 1

[profile.low-spec]
inherits = "release"
opt-level = 3
lto = "thin"

[profile.debug-tools]
inherits = "dev"
opt-level = 1

[profile.sdk-tools]
inherits = "release"
opt-level = 2
lto = "thin"

[profile.headless-server]
inherits = "release"
opt-level = 3
lto = "thin"

[dependencies]
rand = "0.8"
wgpu = "27"
winit = "0.30"
glam = "0.30"
bytemuck = { version = "1", features = ["derive"] }
pollster = "0.4"
rapier3d = "0.32"
gltf = "1"
image = "0.25"
rayon = "1"
parking_lot = "0.12"
pathfinding = "4"
slotmap = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bincode = "1"
ron = "0.8"
puffin = "0.19"
bitflags = "2"
egui = "0.33.3"
egui-wgpu = "0.33.3"
egui-winit = "0.33.3"
rodio = { version = "0.19", optional = true }
walkdir = "2.4"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
glob = "0.3"
