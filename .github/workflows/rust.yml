name: Rust

on:
  push:
    branches: [ "main", "engene-2.0-transition" ]
  pull_request:
    branches: [ "main", "engene-2.0-transition" ]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Check formatting
      run: cargo fmt --all -- --check

  clippy:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Install clippy
      run: rustup component add clippy
    - name: Run clippy
      run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  build:
    runs-on: ubuntu-latest
    needs: [fmt, clippy]
    steps:
    - uses: actions/checkout@v4
    - name: Build workspace (all targets)
      run: cargo build --workspace --all-targets
    - name: Build workspace (all features)
      run: cargo build --workspace --all-features

  build_apps:
    runs-on: ubuntu-latest
    needs: [fmt, clippy]
    steps:
    - uses: actions/checkout@v4
    - name: Build engene_game
      run: cargo build -p engene_game
    - name: Build engene_sdk
      run: cargo build -p engene_sdk
    - name: Build engene_headless
      run: cargo build -p engene_headless
    - name: Build engene_bootstrap
      run: cargo build -p engene_bootstrap

  legacy_path_check:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Check for forbidden legacy root-core paths
      run: |
        echo "Checking for forbidden legacy root-core paths..."
        if rg --quiet "crate::core::ecs" src/; then
          echo "ERROR: Found crate::core::ecs usage"
          rg "crate::core::ecs" src/
          exit 1
        fi
        if rg --quiet "crate::core::query" src/; then
          echo "ERROR: Found crate::core::query usage"
          rg "crate::core::query" src/
          exit 1
        fi
        if rg --quiet "crate::core::scheduler" src/; then
          echo "ERROR: Found crate::core::scheduler usage"
          rg "crate::core::scheduler" src/
          exit 1
        fi
        if rg --quiet "crate::core::system" src/; then
          echo "ERROR: Found crate::core::system usage"
          rg "crate::core::system" src/
          exit 1
        fi
        if rg --quiet "crate::core::systems" src/; then
          echo "ERROR: Found crate::core::systems usage"
          rg "crate::core::systems" src/
          exit 1
        fi
        if rg --quiet "crate::core::engine" src/; then
          echo "ERROR: Found crate::core::engine usage"
          rg "crate::core::engine" src/
          exit 1
        fi
        echo "No forbidden legacy paths found"

  smoke:
    runs-on: ubuntu-latest
    needs: [build]
    steps:
    - uses: actions/checkout@v4
    - name: Install nextest
      uses: taiki-e/install-action@v2
      with:
        tool: nextest
    - name: Run smoke tests
      run: cargo nextest run --profile ci --test engine_contracts --test production_candidate --test entrypoint_and_operator_truth --test ci_surface_contracts

  contracts:
    runs-on: ubuntu-latest
    needs: [build]
    steps:
    - uses: actions/checkout@v4
    - name: Install nextest
      uses: taiki-e/install-action@v2
      with:
        tool: nextest
    - name: Run contract tests
      run: cargo nextest run --profile ci --test physics_core_boundary_contracts --test physics_bootstrap_contracts --test runtime_phase_contracts --test streaming_semantic_laws --test streaming_resource_laws --test streaming_determinism_laws --test tick_deterministic_smoke --test spatial_dirty_contracts

  architectural_gates:
    runs-on: ubuntu-latest
    needs: [build]
    steps:
    - uses: actions/checkout@v4
    - name: Install nextest
      uses: taiki-e/install-action@v2
      with:
        tool: nextest
    - name: Run architectural gates
      run: cargo nextest run --profile ci --test architectural_gates

  world:
    runs-on: ubuntu-latest
    needs: [build]
    steps:
    - uses: actions/checkout@v4
    - name: Install nextest
      uses: taiki-e/install-action@v2
      with:
        tool: nextest
    - name: Run world tests
      run: cargo nextest run --profile ci --test world_persistence_contracts --test spatial_dirty_contracts --test world_fields_contracts --test streaming_implementation_shape

  full_test:
    runs-on: ubuntu-latest
    needs: [fmt, clippy, build]
    steps:
    - uses: actions/checkout@v4
    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable
      
    - name: Cache cargo registry
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-cargo-
      
    - name: Run full test suite (deterministic single-threaded)
      run: cargo test --workspace --all-features --no-fail-fast -- --test-threads=1
