[package]
name = "engine_startup"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Shared startup infrastructure for engine applications"

[dependencies]
chrono = "0.4"
backtrace = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
